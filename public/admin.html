<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bahir Dar University | Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .admin-wrap{max-width:1180px;margin:auto;padding:70px 5vw 100px}.admin-top{display:flex;justify-content:space-between;align-items:end;margin-bottom:55px}.admin-top h1{font:600 clamp(3rem,6vw,6rem)/.9 var(--display);letter-spacing:-.075em;margin:0}.admin-top h1 em{color:var(--orange);font-style:normal}.admin-kicker{font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:700;color:var(--muted)}.admin-panel{background:var(--ink);color:var(--paper);padding:34px}.admin-panel h2{font-size:25px;letter-spacing:-.04em;margin:0 0 25px}.login-form{display:grid;grid-template-columns:1fr 1fr auto;gap:22px;align-items:end}.login-form label{margin:0;color:var(--paper)}.login-form input{border-color:#60655f;color:var(--paper)}.admin-status{font-size:12px;color:var(--orange);min-height:18px;margin:18px 0 0}.dashboard{margin-top:55px}.dashboard-head{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:18px}.dashboard-head h2{font-size:32px;margin:0}.student-count{background:var(--lime);padding:7px 12px;font-size:11px;font-weight:700}.student-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}.student-table th{text-align:left;color:var(--muted);font-size:10px;letter-spacing:.1em;text-transform:uppercase}.student-table th,.student-table td{padding:18px 10px;border-bottom:1px solid var(--line)}.student-table th:first-child,.student-table td:first-child{padding-left:0}.empty-state{color:var(--muted);padding:25px 0}.logout-button{border:1px solid var(--ink);background:transparent;padding:10px 14px;font-size:12px}.logout-button:hover{background:var(--ink);color:var(--paper)}@media(max-width:760px){.admin-wrap{padding:45px 6vw}.admin-top{display:block;margin-bottom:35px}.admin-top .text-link{display:inline-block;margin-top:20px}.admin-panel{padding:24px}.login-form{display:block}.login-form label{margin:18px 0}.login-form .button{width:100%;justify-content:space-between}.student-table{display:block;overflow-x:auto;white-space:nowrap}}
    .admin-search{display:block;max-width:360px;margin:25px 0 8px}
  </style>
</head>
<body>
  <header class="site-header"><a class="brand university-brand" href="/"><img src="/bahir-dar-university-logo.png.jpg" alt="Bahir Dar University logo"><span>Bahir Dar<br><strong>University</strong><small>Innovation Center</small></span></a><a class="text-link" href="/">Back to website ↗</a></header>
  <main class="admin-wrap">
    <div class="admin-top"><div><p class="admin-kicker">Private workspace</p><h1>Student<br><em>signals.</em></h1></div><p class="admin-kicker">Bahir Dar University / Admin</p></div>
    <section class="admin-panel" id="login-panel"><h2>Sign in to view registrations</h2><form class="login-form" id="admin-login"><label>Email<input name="email" type="email" value="admin@innovation.center" required></label><label>Password<input name="password" type="password" required></label><button class="button" type="submit">Open dashboard <span>↗</span></button></form><p class="admin-status" role="status"></p></section>
    <section class="dashboard" id="dashboard" hidden><div class="dashboard-head"><h2>New community members</h2><div><span class="student-count" id="student-count">0 registrations</span> <button class="logout-button" id="logout">Log out</button> <button class="button button-small" id="export-data" type="button">Export CSV</button></div></div><label class="admin-search">Search registrations<input id="student-search" type="search" placeholder="Name, email, school ID, or project idea"></label><div id="student-table-wrap"></div></section>
  </main>
  <script>
    const loginForm = document.querySelector('#admin-login');
    const loginPanel = document.querySelector('#login-panel');
    const dashboard = document.querySelector('#dashboard');
    const status = document.querySelector('.admin-status');
    const tableWrap = document.querySelector('#student-table-wrap');
    const count = document.querySelector('#student-count');
    const tokenKey = 'innovation-admin-token';
    const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
    let allStudents = [];
    function renderStudents(students) {
      count.textContent = `${students.length} registration${students.length === 1 ? '' : 's'}`;
      tableWrap.innerHTML = students.length ? `<table class="student-table"><thead><tr><th>Name</th><th>Email</th><th>School ID</th><th>Project idea</th><th>Joined</th></tr></thead><tbody>${students.map((student) => `<tr><td>${escapeHtml(student.name)}</td><td>${escapeHtml(student.email)}</td><td>${escapeHtml(student.schoolId || student.department || '—')}</td><td>${escapeHtml(student.projectIdea || student.interests || '—')}</td><td>${new Date(student.createdAt).toLocaleDateString()}</td></tr>`).join('')}</tbody></table>` : '<p class="empty-state">No matching registrations.</p>';
    }
    async function loadStudents(token) {
      const response = await fetch('/students', { headers: { Authorization: `Bearer ${token}` } });
      if (!response.ok) throw new Error('Your session has expired. Please sign in again.');
      allStudents = await response.json();
      renderStudents(allStudents);
      loginPanel.hidden = true;
      dashboard.hidden = false;
    }
    async function exportStudents(token) {
      const response = await fetch('/students/export', { headers: { Authorization: `Bearer ${token}` } });
      if (!response.ok) throw new Error('Unable to export registrations.');
      const blob = await response.blob();
      const href = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = href;
      link.download = 'student-registrations.csv';
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(href);
    }
    loginForm.addEventListener('submit', async (event) => { event.preventDefault(); status.textContent = 'Checking credentials...'; try { const response = await fetch('/admin/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(Object.fromEntries(new FormData(loginForm))) }); const result = await response.json(); if (!response.ok) throw new Error(result.message); localStorage.setItem(tokenKey, result.token); await loadStudents(result.token); } catch (error) { status.textContent = error.message; } });
    document.querySelector('#logout').addEventListener('click', () => { localStorage.removeItem(tokenKey); dashboard.hidden = true; loginPanel.hidden = false; loginForm.reset(); });
    document.querySelector('#student-search').addEventListener('input', (event) => { const query = event.target.value.toLowerCase(); renderStudents(allStudents.filter((student) => [student.name, student.email, student.schoolId, student.projectIdea, student.department, student.interests].filter(Boolean).some((value) => String(value).toLowerCase().includes(query)))); });
    document.querySelector('#export-data').addEventListener('click', async () => {
      const token = localStorage.getItem(tokenKey);
      if (!token) return;
      try {
        await exportStudents(token);
      } catch (error) {
        status.textContent = error.message;
      }
    });
    const savedToken = localStorage.getItem(tokenKey); if (savedToken) loadStudents(savedToken).catch(() => localStorage.removeItem(tokenKey));
  </script>
</body>
</html>
